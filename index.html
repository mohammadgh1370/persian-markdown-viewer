<style>
:root{
  --bg:#fbfcfd;--surface:#f1f4f7;--ink:#1b2430;--muted:#5d6b7c;--line:#dde3ea;
  --accent:#0e6e78;--accent-ink:#fff;--code-bg:#f1f4f7;--quote:#e6f3f4;
  --font-body:"Vazirmatn","Segoe UI",Tahoma,sans-serif;
  --fs:19px;--measure:92ch;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="sepia"]){
    --bg:#0f1419;--surface:#171e26;--ink:#dde2e8;--muted:#8d9aaa;--line:#27313c;
    --accent:#5cc8d0;--accent-ink:#06282b;--code-bg:#171e26;--quote:#132a2d;color-scheme:dark}
}
:root[data-theme="dark"]{
  --bg:#0f1419;--surface:#171e26;--ink:#dde2e8;--muted:#8d9aaa;--line:#27313c;
  --accent:#5cc8d0;--accent-ink:#06282b;--code-bg:#171e26;--quote:#132a2d;color-scheme:dark}
:root[data-theme="sepia"]{
  --bg:#f4ecdc;--surface:#ebe1cd;--ink:#3b3226;--muted:#7a6b57;--line:#d9ccb3;
  --accent:#8a4b1f;--accent-ink:#fff;--code-bg:#ebe1cd;--quote:#efdfc3}
:root[data-font="naskh"]{--font-body:"Noto Naskh Arabic","Vazirmatn",serif}
:root[data-width="narrow"]{--measure:72ch}
:root[data-width="wide"]{--measure:120ch}
:root[data-width="full"]{--measure:none}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;max-width:1600px;margin:0 auto}
.brand{font-weight:700;font-size:1rem;margin-inline-end:auto}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
#progress{height:2px;background:var(--accent);width:0}

.panel{display:none;position:absolute;top:100%;left:max(16px,calc(50% - 784px));margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;width:340px;max-width:calc(100vw - 24px);box-shadow:0 12px 40px rgb(0 0 0/.18)}
.panel.open{display:block}
.row{margin-bottom:18px}.row:last-child{margin:0}
.row>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:7px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:9px 4px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.step{display:flex;align-items:center;gap:14px}.step .btn{width:44px;padding:7px 0;font-size:1.1rem}.step output{min-width:3em;text-align:center}
.ltr{direction:ltr;unicode-bidi:isolate}
.bi{direction:rtl;unicode-bidi:isolate}
.dgw{direction:ltr;overflow-x:auto;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin:1.2em 0}
.dg{position:relative;font-size:.8em}
.dgs{position:absolute;left:0;top:0;color:var(--muted);overflow:visible}
.dp{position:absolute;white-space:nowrap;height:1.4em}
.dp .dt{display:block;width:100%;font-family:var(--font-body);font-size:.95em;line-height:1.474;text-align:start}
.dp .dt.c{text-align:center}

#editor{max-width:1100px;margin:0 auto;padding:28px 16px 48px}
#editor h1{font-size:1.5rem;margin:0 0 6px}
#editor p{color:var(--muted);margin:0 0 18px;line-height:1.9}
#src{width:100%;min-height:58vh;resize:vertical;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--font-body);font-size:1rem;line-height:1.8;color:var(--ink)}
#src:focus{outline:2px solid var(--accent);border-color:transparent}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

#reader{display:none;max-width:1600px;margin:0 auto;padding:0 16px;grid-template-columns:260px minmax(0,1fr);gap:48px}
body.reading #reader{display:grid}
body.reading #editor{display:none}
body.toc-collapsed #reader,body.no-toc #reader{grid-template-columns:minmax(0,1fr)}
body.toc-collapsed #toc,body.no-toc #toc{display:none}
#toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding:28px 0;font-size:.88rem;line-height:1.7}
#toc strong{display:block;margin-bottom:8px;color:var(--muted);font-weight:500}
#toc a{display:block;padding:3px 10px;color:var(--muted);text-decoration:none;border-inline-start:2px solid var(--line)}
#toc a.l2{padding-inline-start:22px}#toc a.l3{padding-inline-start:34px}
#toc a:hover{color:var(--ink)}
#toc a.on{color:var(--accent);border-inline-start-color:var(--accent);font-weight:500}

article{max-width:var(--measure);width:100%;margin:0 auto;padding:36px 0 120px;font-size:var(--fs);line-height:2;text-align:start;overflow-wrap:anywhere}
article>*:first-child{margin-top:0}
article p{margin:0 0 1.1em}
article h1,article h2,article h3,article h4,article h5,article h6{line-height:1.5;margin:1.9em 0 .6em;font-weight:700}
article h1{font-size:1.75em;padding-bottom:.35em;border-bottom:1px solid var(--line)}
article h2{font-size:1.45em}article h3{font-size:1.2em}article h4,article h5,article h6{font-size:1.05em}
article a{color:var(--accent);text-underline-offset:4px}
article ul,article ol{padding-inline:1.6em 0;margin:0 0 1.1em}
article li{margin:.3em 0}
article li>ul,article li>ol{margin:.3em 0}
article blockquote{margin:1.2em 0;padding:.6em 1.1em;background:var(--quote);border-inline-start:4px solid var(--accent);border-radius:4px 8px 8px 4px}
article blockquote p:last-child{margin:0}
article hr{border:0;border-top:1px solid var(--line);margin:2.2em 0}
article img{max-width:100%;height:auto;border-radius:8px}
article code{font-family:var(--mono);font-size:.82em;background:var(--code-bg);padding:.15em .4em;border-radius:5px;direction:ltr;unicode-bidi:isolate;display:inline-block;line-height:1.5}
article pre{direction:ltr;text-align:left;unicode-bidi:isolate;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:16px 18px;overflow-x:auto;margin:1.2em 0;line-height:1.65}
article pre code{background:none;padding:0;font-size:.8em;display:block;white-space:pre}
.tw{overflow-x:auto;margin:1.2em 0}
article table{border-collapse:collapse;font-size:.92em;line-height:1.75;min-width:100%}
article th,article td{border:1px solid var(--line);padding:8px 12px;text-align:start;vertical-align:top}
article th{background:var(--surface);font-weight:700}
article input[type=checkbox]{accent-color:var(--accent);margin-inline:0 .5em}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--accent);font-weight:500}
.hljs-string,.hljs-attr{color:#b4572a}.hljs-comment{color:var(--muted);font-style:italic}
.hljs-number,.hljs-title{color:#7a4fb5}
:root[data-theme="dark"] .hljs-string,:root[data-theme="dark"] .hljs-attr{color:#e6a574}
:root[data-theme="dark"] .hljs-number,:root[data-theme="dark"] .hljs-title{color:#b99cf0}

@media (max-width:960px){
  #reader{grid-template-columns:minmax(0,1fr)}
  #toc{display:none;position:fixed;inset-inline:12px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:25;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:65vh;box-shadow:0 8px 30px rgb(0 0 0/.15)}
  body.toc-open #toc{display:block}
  article{font-size:calc(var(--fs) - 1px);line-height:1.95}
}
@media print{header,#toc,#editor,body::before{display:none!important}#reader{display:block!important}}

;"object"==typeof exports&&"undefined"!=typeof module&&(module.exports=hljs);</script>
<script>
const $=s=>document.querySelector(s), root=document.documentElement;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const src=$('#src'), doc=$('#doc'), toc=$('#toc');

/* ---------- settings ---------- */
const cfg={fs:store.get('fs')||'19',width:store.get('width')||'md',font:store.get('font')||'vazir',theme:store.get('theme')||'auto'};
function applyCfg(){
  root.style.setProperty('--fs',cfg.fs+'px');
  root.dataset.width=cfg.width;root.dataset.font=cfg.font;root.dataset.theme=cfg.theme;
  $('#fsv').textContent=cfg.fs;
  document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',cfg[s.dataset.k]===b.dataset.v)));
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.parentElement.dataset.k;cfg[k]=b.dataset.v;store.set(k,cfg[k]);applyCfg()});
document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{cfg.fs=String(Math.min(28,Math.max(14,+cfg.fs+ +b.dataset.fs)));store.set('fs',cfg.fs);applyCfg()});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#panel').classList.remove('open')});
applyCfg();
$('#setBtn').onclick=()=>{const o=$('#panel').classList.toggle('open');$('#setBtn').setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!e.target.closest('#panel,#setBtn'))$('#panel').classList.remove('open')});

/* ---------- direction detection ---------- */
const RTL=/[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFC]/, LAT=/[A-Za-z]/;
function firstStrong(t){const r=(t.match(/[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFC]+/g)||[]).length,l=(t.match(/[A-Za-z]+/g)||[]).length;if(!r&&!l)return null;return r>=l*0.5?'rtl':'ltr'}
function majority(t){const r=(t.match(new RegExp(RTL.source,'g'))||[]).length,l=(t.match(/[A-Za-z]/g)||[]).length;return r>=l?'rtl':'ltr'}
function tx(el,lists){const c=el.cloneNode(true);c.querySelectorAll('code,kbd,samp,pre'+(lists?',ul,ol':'')).forEach(x=>x.remove());return c.textContent}
function fixDirs(){
  doc.querySelectorAll('p,h1,h2,h3,h4,h5,h6,blockquote,summary').forEach(el=>{const d=firstStrong(tx(el));if(d)el.dir=d});
  doc.querySelectorAll('li').forEach(li=>{const d=firstStrong(tx(li,true));if(d)li.dir=d});
  doc.querySelectorAll('ul,ol').forEach(l=>{const li=l.querySelector('li');const d=li&&firstStrong(tx(li,true));l.dir=d||'rtl'});
  doc.querySelectorAll('table').forEach(t=>{
    t.dir=majority(tx(t));
    t.querySelectorAll('th,td').forEach(c=>{const d=firstStrong(tx(c));if(d)c.dir=d});
    const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t);
  });
  doc.querySelectorAll('pre').forEach(p=>p.dir='ltr');
  diagrams();
  wrapLatin();
}
/* Box-drawing diagrams containing Persian: lines are drawn as SVG on a fixed grid, text is placed by column */
function diagrams(){
  const SEG={'─':'LR','━':'LR','═':'LR','│':'UD','┃':'UD','║':'UD','┌':'DR','╭':'DR','┏':'DR','╔':'DR','┐':'DL','╮':'DL','┓':'DL','╗':'DL','└':'UR','╰':'UR','┗':'UR','╚':'UR','┘':'UL','╯':'UL','┛':'UL','╝':'UL','├':'UDR','┤':'UDL','┬':'LRD','┴':'LRU','┼':'UDLR'};
  const ARR={'▶':'R','►':'R','→':'R','◀':'L','◄':'L','←':'L','▲':'U','↑':'U','▼':'D','↓':'D'};
  const JUNC='┌┐└┘├┤┬┴┼╭╮╰╯';
  const TXT=/[^\s\u2500-\u257F\u2190-\u21FF\u25A0-\u25FF]+(?: [^\s\u2500-\u257F\u2190-\u21FF\u25A0-\u25FF]+)*/g;
  const W=6,H=14,NS='http://www.w3.org/2000/svg';
  doc.querySelectorAll('pre').forEach(pre=>{
    const t=pre.textContent;
    if(!/[\u2500-\u257F]/.test(t)||!RTL.test(t))return;
    const lines=t.replace(/\n$/,'').split('\n');
    const rows=lines.map(L=>{
      const cells=[],texts=[];let m;
      for(let c=0;c<L.length;c++){const ch=L[c];if(SEG[ch]||ARR[ch])cells.push({c,ch})}
      TXT.lastIndex=0;
      while((m=TXT.exec(L)))texts.push({c:m.index,n:m[0].length,s:m[0]});
      return{cells,texts};
    });
    /* Persian glyph widths make the source columns drift: pull every vertically connected border/corner onto one column (the column of its top-most cell) */
    const F=ch=>SEG[ch]||({R:'L',L:'R',U:'D',D:'U'}[ARR[ch]]||'');
    const all=[];
    rows.forEach((r,i)=>r.cells.forEach(k=>{k.i=i;k.f=F(k.ch);all.push(k)}));
    const par=new Map(all.map(k=>[k,k]));
    const find=k=>{while(par.get(k)!==k)k=par.get(k);return k};
    rows.forEach((r,i)=>{if(i+1<rows.length)r.cells.forEach(a=>{if(a.f.includes('D'))rows[i+1].cells.forEach(b=>{if(b.f.includes('U')&&Math.abs(a.c-b.c)<=3)par.set(find(b),find(a))})})});
    const top=new Map();
    all.forEach(k=>{const g=find(k);if(!top.has(g))top.set(g,k.c)});
    all.forEach(k=>{k.c=top.get(find(k))});
    const cols=Math.max(...lines.map(l=>l.length))+1;
    let d='',tri='';
    rows.forEach((r,i)=>{
      const m=new Map(),y=i*H,cy=y+H/2;
      r.cells.forEach(k=>{
        m.set(k.c,(m.get(k.c)||'')+k.f);
        const a=ARR[k.ch],x=k.c*W,cx=x+W/2;
        if(a==='R')tri+='M'+(x+1.2)+' '+(cy-3)+'L'+(x+5.2)+' '+cy+'L'+(x+1.2)+' '+(cy+3)+'Z';
        if(a==='L')tri+='M'+(x+4.8)+' '+(cy-3)+'L'+(x+0.8)+' '+cy+'L'+(x+4.8)+' '+(cy+3)+'Z';
        if(a==='U')tri+='M'+cx+' '+(y+3.5)+'L'+(cx+3)+' '+(y+9)+'L'+(cx-3)+' '+(y+9)+'Z';
        if(a==='D')tri+='M'+(cx-3)+' '+(y+4.5)+'L'+(cx+3)+' '+(y+4.5)+'L'+cx+' '+(y+10)+'Z';
      });
      const cs=[...m.keys()].sort((p,q)=>p-q);
      cs.forEach(c=>{const f=m.get(c),cx=c*W+W/2;if(f.includes('U'))d+='M'+cx+' '+cy+'V'+y;if(f.includes('D'))d+='M'+cx+' '+cy+'V'+(y+H)});
      for(let n=0;n<cs.length-1;n++)if(cs[n+1]-cs[n]<=3&&m.get(cs[n]).includes('R')&&m.get(cs[n+1]).includes('L'))d+='M'+(cs[n]*W+W/2)+' '+cy+'H'+(cs[n+1]*W+W/2);
    });
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('class','dgs');svg.setAttribute('viewBox','0 0 '+cols*W+' '+rows.length*H);
    svg.style.width=cols*0.6+'em';svg.style.height=rows.length*1.4+'em';
    svg.innerHTML='<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="1"/><path d="'+tri+'" fill="currentColor"/>';
    const wrap=document.createElement('div'),box=document.createElement('div');
    wrap.className='dgw';box.className='dg';box.dir='ltr';
    box.style.width=cols*0.6+'em';box.style.height=rows.length*1.4+'em';
    box.append(svg);
    rows.forEach((r,i)=>{
      const v=r.cells.filter(k=>SEG[k.ch]==='UD').map(k=>k.c);
      r.texts.forEach(x=>{
        const mid=x.c+x.n/2,l=Math.max(-1,...v.filter(c=>c<mid)),rt=Math.min(1e9,...v.filter(c=>c>mid));
        const enc=l>=0&&rt<1e9&&rt-l-1>=x.n*0.8;
        const st=enc?l+1:x.c,len=enc?rt-l-1:x.n;
        const h=document.createElement('span');h.className='dp';
        h.style.left=st*0.6+'em';h.style.top=i*1.4+'em';h.style.width=len*0.6+'em';
        const e=document.createElement('span');e.className='dt'+(enc?' c':'');
        e.dir=firstStrong(x.s)||'ltr';e.textContent=x.s;
        h.append(e);box.append(h);
      });
    });
    wrap.append(box);pre.replaceWith(wrap);
  });
}
/* code blocks that mix Persian and English: keep the code part LTR and isolate every Persian phrase as one RTL unit */
function isolateCode(){
  const SEP=/[\u2190-\u2194\u21D0-\u21D4]|\/\/|#\s|--\s|\s{2,}/g;
  doc.querySelectorAll('pre code').forEach(code=>{
    const w=document.createTreeWalker(code,NodeFilter.SHOW_TEXT),nodes=[];
    while(w.nextNode())nodes.push(w.currentNode);
    nodes.forEach(n=>{
      const t=n.nodeValue;if(!RTL.test(t))return;
      const f=document.createDocumentFragment();
      t.split('\n').forEach((ln,k)=>{
        if(k)f.append('\n');
        const i=ln.search(RTL);
        if(i<0){f.append(ln);return}
        let s=0,m;SEP.lastIndex=0;
        while((m=SEP.exec(ln))&&m.index<i)s=m.index+m[0].length;
        while(ln[s]===' ')s++;
        if(s>i)s=i;
        f.append(ln.slice(0,s));
        const b=document.createElement('span');b.className='bi';b.dir='rtl';b.textContent=ln.slice(s);f.append(b);
      });
      n.replaceWith(f);
    });
  });
}
function wrapLatin(){
  const re=/[A-Za-z][A-Za-z0-9 _.\/:@#%+-]*[A-Za-z0-9]|[A-Za-z]/g,w=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT),nodes=[];
  while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const p=n.parentElement;
    if(p.closest('pre,code')||p.closest('[dir]').dir!=='rtl')return;
    const t=n.nodeValue;if(!/[A-Za-z]/.test(t))return;
    const f=document.createDocumentFragment();let last=0,m;re.lastIndex=0;
    while((m=re.exec(t))){f.append(t.slice(last,m.index));const s=document.createElement('span');s.className='ltr';s.textContent=m[0];f.append(s);last=m.index+m[0].length}
    f.append(t.slice(last));n.replaceWith(f);
  });
}

/* ---------- render ---------- */
DOMPurify.addHook('afterSanitizeAttributes',n=>{
  if(n.tagName==='A'&&!(n.getAttribute('href')||'').startsWith('#')){n.setAttribute('target','_blank');n.setAttribute('rel','noopener noreferrer')}
});
let heads=[];
function render(){
  const md=src.value;
  if(!md.trim()){setReading(false);return}
  doc.innerHTML=DOMPurify.sanitize(marked.parse(md,{gfm:true}));
  fixDirs();
  try{doc.querySelectorAll('pre code').forEach(b=>{if(!/language-/.test(b.className)&&RTL.test(b.textContent))return;hljs.highlightElement(b)})}catch(e){}
  isolateCode();
  heads=[...doc.querySelectorAll('h1,h2,h3')];
  toc.innerHTML='<strong>در این سند</strong>';
  heads.forEach((h,i)=>{
    h.id='h'+i;
    const a=document.createElement('a');a.href='#h'+i;a.textContent=h.textContent;a.className='l'+h.tagName[1];
    a.dir=h.dir||'rtl';a.onclick=e=>{e.preventDefault();h.scrollIntoView({behavior:'smooth'});document.body.classList.remove('toc-open')};
    toc.appendChild(a);
  });
  $('#tocBtn').hidden=!heads.length;
  document.body.classList.toggle('no-toc',!heads.length);
  store.set('md',md);
  setReading(true);
  onScroll();
}
function setReading(on){
  document.body.classList.toggle('reading',on);
  $('#toggleBtn').textContent=on?'ویرایش متن':'متن جدید';
  if(on)window.scrollTo(0,0);else src.focus();
}
$('#toggleBtn').onclick=()=>setReading(!document.body.classList.contains('reading'));
$('#renderBtn').onclick=render;
$('#clearBtn').onclick=()=>{src.value='';store.set('md','');src.focus()};
$('#tocBtn').onclick=()=>{if(innerWidth>960){const c=document.body.classList.toggle('toc-collapsed');store.set('toc',c?'0':'1')}else document.body.classList.toggle('toc-open')};
if(store.get('toc')==='0')document.body.classList.add('toc-collapsed');
$('#pasteBtn').onclick=async()=>{
  try{src.value=await navigator.clipboard.readText();render()}
  catch(e){src.focus();$('#pasteBtn').textContent='با Ctrl+V یا ⌘V بچسبانید'}
};
src.addEventListener('paste',()=>{if(!src.value.trim())setTimeout(render,50)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!document.body.classList.contains('reading'))render()});

/* ---------- progress + active heading ---------- */
function onScroll(){
  if(!document.body.classList.contains('reading'))return;
  const max=document.documentElement.scrollHeight-innerHeight;
  $('#progress').style.width=(max>0?scrollY/max*100:0)+'%';
  let cur=0;heads.forEach((h,i)=>{if(h.getBoundingClientRect().top<120)cur=i});
  toc.querySelectorAll('a').forEach((a,i)=>a.classList.toggle('on',i===cur));
}
addEventListener('scroll',onScroll,{passive:true});

if(!window.isSecureContext)$('#pasteBtn').hidden=true;
/* ---------- restore ---------- */
const saved=store.get('md');
if(saved){src.value=saved;render()}
</script>
</body>
</html>
